[[kv_namespaces]]
binding = "FORM_STATE" # 雲端用獨立 namespace（LINE_SAAS_STATE），與 bni 的同名空間區隔
id = "e4f3651d09664c1d98dd97521e7b435f"
preview_id = "5b4155118f5b49539b441fc5c0cbdd4e"
